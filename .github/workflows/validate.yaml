name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Topics are configured in the GitHub UI. Integration brands belong in
          # home-assistant/brands. Remove these ignores after both external steps.
          ignore: "brands topics"
